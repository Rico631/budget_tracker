schema: spec-driven

context: |
  Язык:
  - Все артефакты OpenSpec должны писаться на русском языке.
  - Названия технологий, библиотек, API, классов, методов, файлов и других программных сущностей не переводить.
  - Код, идентификаторы и команды оставлять в оригинальном виде.
  - Технические термины допускается оставлять на английском языке, если это общепринятый термин в разработке.
  - Документация должна быть понятной и конкретной, без лишней воды.

  Проект:
  - Название: budget_tracker
  - Тип: мобильное приложение для Android.
  - Назначение: управление личными финансами.
  - Основные задачи приложения: учет доходов и расходов, управление финансовыми операциями,
    просмотр финансовой информации и анализ личных финансов.
  
  Технологический стек:
  - Flutter
  - Dart
  - Android
  - Основная кодовая база ориентирована на Flutter.
  
  Правила проектирования:
  - При описании изменений учитывать особенности мобильного приложения и Flutter.
  - Не предполагать наличие серверной части, backend или web-интерфейса, если это явно не указано в задаче.
  - При изменениях UI учитывать Android UX и Flutter widget architecture.
  - При изменении бизнес-логики отделять UI, domain/business logic и data access, если архитектура проекта это позволяет.
  - Сохранять существующие архитектурные и кодовые соглашения проекта, если задача явно не требует их изменения.
  - Не добавлять новые библиотеки и архитектурные подходы без необходимости.
  - При предложении новой зависимости указывать причину её необходимости.

rules:
  proposal:
    - Описывай задачу и её цель на русском языке.
    - Явно указывай, какую пользовательскую или бизнес-проблему решает изменение.
    - Не включай детали реализации, если они не нужны для понимания цели изменения.

  specs:
    - Все требования и сценарии пиши на русском языке.
    - Требования должны быть проверяемыми и однозначными.
    - Для пользовательского поведения используй сценарии Given/When/Then, но описывай их на русском языке.
    - Учитывай как основное поведение, так и важные edge cases.

  design:
    - Описывай архитектурные решения на русском языке.
    - Для Flutter-изменений явно указывай затрагиваемые слои, компоненты, экраны и зависимости.
    - Отдельно фиксируй важные архитектурные решения и их причины.
    - Не усложняй архитектуру без необходимости.

  tasks:
    - Формулируй задачи на русском языке.
    - Разбивай реализацию на небольшие последовательные задачи.
    - Каждая задача должна быть достаточно конкретной, чтобы разработчик мог выполнить её без дополнительного уточнения.
    - Для изменений пользовательского поведения предусматривать соответствующие тесты.
    - Для Flutter UI изменений предусматривать widget tests там, где это действительно необходимо.